name: AB extension contracts

on:
  push:
    branches: ['ab-brainmaster/**']
    paths:
      - 'packages/ab-bill-context/**'
      - 'packages/ab-upstream-review/**'
      - 'packages/ab-context-bridge/**'
      - 'src/packages/process-host/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/ab-extensions.yml'
  pull_request:
    paths:
      - 'packages/ab-bill-context/**'
      - 'packages/ab-upstream-review/**'
      - 'packages/ab-context-bridge/**'
      - 'src/packages/process-host/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/ab-extensions.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  node-contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      ORCA_BACKGROUND_LAUNCH: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.22.1'
      - name: Install and build the workspace process host
        run: |
          npm install --global pnpm@12.14.0
          pnpm install --frozen-lockfile --ignore-scripts
          pnpm run build:packages
      - name: Install context adapter dependencies from shrinkwrap
        run: npm ci --prefix packages/ab-context-bridge --ignore-scripts --omit=optional --no-audit --no-fund
      - name: Run AB contracts
        run: >-
          node --test --test-isolation=none
          packages/ab-bill-context/tests/*.test.mjs
          packages/ab-upstream-review/tests/*.test.mjs
          packages/ab-context-bridge/tests/*.test.mjs
